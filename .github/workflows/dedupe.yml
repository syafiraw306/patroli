name: Dedupe Dry Run

on:
  workflow_dispatch:

jobs:
  dedupe:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cek patroli.py
        run: |
          echo "=== CEK ARGUMENT ==="
          grep -n "dedupe-dry-run" patroli.py || true

          echo "=== CEK FUNGSI ==="
          grep -n "def dedupe_dry_run" patroli.py || true

      - name: Jalankan Dedupe Dry Run
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TAHUN_TARGET: "2026"
          NAMA_SATKER: "Kejaksaan Negeri Deli Serdang"
        run: |
          python patroli.py --dedupe-dry-run

      - name: Upload laporan dedupe
        uses: actions/upload-artifact@v4
        with:
          name: dedupe-report
          path: |
            dedupe_report.csv
            dedupe_report.json
          if-no-files-found: error
