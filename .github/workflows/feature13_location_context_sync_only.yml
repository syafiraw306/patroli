name: Feature 13 - Location Context Sync Only

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  feature13-context-sync:
    name: Feature #13 Context Sync Only
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Verify Feature #13 sync command
        run: |
          python -m py_compile patroli.py
          python patroli.py --help | grep -F -- "--sync-feature13-location-context-only"

      - name: Run Feature #13 context sync only
        run: |
          python patroli.py --sync-feature13-location-context-only
