name: Feature 13 - LAPINSUS AI V1.5 Pilot #33979

on:
  workflow_dispatch:

jobs:
  pilot:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      LAPINSUS_AI_MODEL: gpt-5.6-luna
      LAPINSUS_SOURCE_TIMEOUT: "20"
      LAPINSUS_IMAGE_MAX: "6"
      LAPINSUS_IMAGE_HASH_TIMEOUT: "8"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install requirements
        run: pip install -r feature13-lapinsus-ai-v1_5-requirements.txt
      - name: Compile check
        run: python -m py_compile feature13_lapinsus_ai.py feature13_lapinsus_engine.py feature13_panel.py feature13_lapinsus_ai_pilot_33979.py feature13_lapinsus_ai_v1_5_regression.py
      - name: V1.5 offline regression
        run: python feature13_lapinsus_ai_v1_5_regression.py
      - name: Run pilot #33979 (read-only)
        run: python feature13_lapinsus_ai_pilot_33979.py
      - name: Verify generated artifacts and acceptance
        shell: bash
        run: |
          set -euo pipefail
          test -s LAPINSUS_33979_AI_V1_5_PILOT.pdf
          test -s LAPINSUS_33979_AI_V1_5_PILOT.json
          file LAPINSUS_33979_AI_V1_5_PILOT.pdf
          python - <<'PY'
          import json
          from pathlib import Path
          audit=json.loads(Path('LAPINSUS_33979_AI_V1_5_PILOT.json').read_text())
          checks={
            'ai_version': audit.get('ai_version')=='LAPINSUS_DELI_SERDANG_AI_V1_5',
            'grounding': audit.get('grounding',{}).get('passed') is True,
            'no_db_mutation': audit.get('database_mutation') is False,
            'no_telegram': audit.get('telegram_sent') is False,
            'publisher_extraction': audit.get('source_extraction_method')=='publisher_jsonld_or_dom',
            'source_sentences': audit.get('source_sentence_count',0)>=3,
            'images': audit.get('image_count',0)>0,
            'fact_evidence': len(audit.get('fact_evidence') or [])>=4,
            'meaningful_trend_evidence': len([x for x in (audit.get('trend_evidence') or []) if x.get('basis')!='source_limitation'])>=1,
          }
          print('=== V1.5 ACCEPTANCE ===')
          for k,v in checks.items(): print(f'{k}: {"PASS" if v else "FAIL"}')
          print('facts:',len(audit.get('facts') or []))
          print('fact_evidence:',len(audit.get('fact_evidence') or []))
          print('trends:',len(audit.get('trend') or []))
          print('trend_evidence:',len(audit.get('trend_evidence') or []))
          print('trend_limitations:',len(audit.get('trend_limitations') or []))
          print('images:',audit.get('image_count'))
          print('image_audit:',len(audit.get('image_audit') or []))
          print('extraction:',audit.get('source_extraction_method'))
          if not all(checks.values()): raise SystemExit('V1.5 acceptance failed')
          print('STATUS: PASS')
          PY
      - name: Upload V1.5 pilot artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LAPINSUS-33979-AI-V1-5-PILOT
          path: |
            LAPINSUS_33979_AI_V1_5_PILOT.pdf
            LAPINSUS_33979_AI_V1_5_PILOT.json
          if-no-files-found: error
