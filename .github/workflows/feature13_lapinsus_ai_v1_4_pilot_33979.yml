name: Feature 13 - LAPINSUS AI V1.4 Pilot #33979 (FIXED)

on:
  workflow_dispatch:

jobs:
  pilot:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      LAPINSUS_AI_MODEL: gpt-5.6-luna
      LAPINSUS_SOURCE_TIMEOUT: "20"
      LAPINSUS_IMAGE_MAX: "6"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install requirements
        run: pip install -r feature13-lapinsus-ai-v1_4-requirements.txt
      - name: Compile check
        run: python -m py_compile feature13_lapinsus_ai.py feature13_lapinsus_engine.py feature13_panel.py feature13_lapinsus_ai_pilot_33979.py feature13_lapinsus_ai_v1_4_regression.py
      - name: V1.4 offline regression
        run: python feature13_lapinsus_ai_v1_4_regression.py
      - name: Run pilot #33979 (read-only)
        run: python feature13_lapinsus_ai_pilot_33979.py
      - name: Verify generated artifacts
        shell: bash
        run: |
          set -euo pipefail
          echo '=== Generated files ==='
          ls -lah LAPINSUS_33979_AI_V1_4_PILOT.pdf LAPINSUS_33979_AI_V1_4_PILOT.json
          test -s LAPINSUS_33979_AI_V1_4_PILOT.pdf
          test -s LAPINSUS_33979_AI_V1_4_PILOT.json
          file LAPINSUS_33979_AI_V1_4_PILOT.pdf
          python - <<'PY'
          import json
          from pathlib import Path
          audit=json.loads(Path('LAPINSUS_33979_AI_V1_4_PILOT.json').read_text(encoding='utf-8'))
          print('=== V1.4 DIAGNOSTICS ===')
          for k in ('ai_version','ai_model','source_extraction_method','source_sentence_count','image_count'):
              print(f'{k}:', audit.get(k))
          print('grounding:', audit.get('grounding'))
          print('facts:', len(audit.get('facts') or []))
          print('fact_evidence:', len(audit.get('fact_evidence') or []))
          print('trends:', len(audit.get('trend') or []))
          print('trend_evidence:', len(audit.get('trend_evidence') or []))
          print('database_mutation:', audit.get('database_mutation'))
          print('telegram_sent:', audit.get('telegram_sent'))

          assert audit.get('ai_version') == 'LAPINSUS_DELI_SERDANG_AI_V1_4', f"ai_version={audit.get('ai_version')}"
          assert audit.get('grounding', {}).get('passed') is True, f"grounding={audit.get('grounding')}"
          assert audit.get('database_mutation') is False, f"database_mutation={audit.get('database_mutation')}"
          assert audit.get('telegram_sent') is False, f"telegram_sent={audit.get('telegram_sent')}"
          assert audit.get('source_extraction_method') == 'publisher_jsonld_or_dom', f"extraction={audit.get('source_extraction_method')}"
          assert int(audit.get('source_sentence_count') or 0) >= 3, f"source_sentence_count={audit.get('source_sentence_count')}"
          assert int(audit.get('image_count') or 0) > 0, f"image_count={audit.get('image_count')}"
          assert len(audit.get('fact_evidence') or []) >= 4, f"fact_evidence={len(audit.get('fact_evidence') or [])}"
          assert len(audit.get('trend_evidence') or []) >= 1, f"trend_evidence={len(audit.get('trend_evidence') or [])}"
          print('STATUS: PASS')
          PY
      - name: Upload V1.4 pilot artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LAPINSUS-33979-AI-V1-4-PILOT
          path: |
            LAPINSUS_33979_AI_V1_4_PILOT.pdf
            LAPINSUS_33979_AI_V1_4_PILOT.json
          if-no-files-found: error
