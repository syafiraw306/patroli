name: Feature 13 - Location Entity Verification V3

on:
  workflow_dispatch:

jobs:
  entity-verification-v3:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Compile
        run: python -m py_compile patroli.py

      - name: Cleanup V2 regression
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python patroli.py --test-feature13-cleanup-v2

      - name: Entity Verification V3 (read-only)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python patroli.py --feature13-entity-verification-v3

      - name: Upload V3 reports
        uses: actions/upload-artifact@v4
        with:
          name: feature13-location-entity-verification-v3
          path: |
            feature13_location_entity_verification_v3_dry_run.json
            feature13_location_entity_verification_v3_dry_run.csv
          if-no-files-found: error
