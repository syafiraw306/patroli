name: Feature 13 - Runtime Integration Test

on:
  workflow_dispatch:

jobs:
  runtime-test:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TAHUN_TARGET: "2026"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt reportlab streamlit supabase

      - name: Verify integration files
        run: |
          test -f feature13_panel.py
          test -f feature13_lapinsus_engine.py
          test -f database.py
          test -f feature13_runtime_integration_test.py

      - name: Compile
        run: |
          python -m py_compile database.py feature13_panel.py feature13_lapinsus_engine.py feature13_runtime_integration_test.py

      - name: Run READ-ONLY runtime integration test
        run: python feature13_runtime_integration_test.py
