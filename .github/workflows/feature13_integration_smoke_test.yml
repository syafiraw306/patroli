name: Feature 13 - Integrated Dashboard Smoke Test

on:
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TAHUN_TARGET: '2026'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify integrated files
        run: |
          test -f app_feature13_integrated.py
          test -f feature13_panel.py
          test -f feature13_lapinsus_engine.py

      - name: Compile Python files
        run: |
          python -m py_compile app_feature13_integrated.py
          python -m py_compile feature13_panel.py
          python -m py_compile feature13_lapinsus_engine.py

      - name: Static safety checks
        run: |
          python - <<'PY'
          from pathlib import Path
          app = Path('app_feature13_integrated.py').read_text(encoding='utf-8')
          panel = Path('feature13_panel.py').read_text(encoding='utf-8')
          engine = Path('feature13_lapinsus_engine.py').read_text(encoding='utf-8')
          assert 'render_feature13_panel' in app
          assert '📍 FEATURE #13' in app
          assert 'deli_serdang_location_articles' in panel
          assert 'articles' not in panel.split('FEATURE13_TABLE =')[0].split('from database')[0]
          assert 'Telegram' not in panel
          assert 'def build_lapinsus' in engine
          assert 'def make_pdf' in engine
          print('INTEGRATED DASHBOARD STATIC SMOKE TEST: PASS')
          print('Database mutation: not executed by smoke test')
          PY
