name: Feature 13 V3.1 Approved Mutation Dry Run

on:
  workflow_dispatch:

jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Compile
        run: python -m py_compile patroli.py
      - name: Cleanup V2 regression
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python patroli.py --test-feature13-cleanup-v2
      - name: Approved mutation dry-run
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python feature13_v31_approved_mutation_dry_run.py
      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: feature13-v31-approved-mutation-dry-run
          path: |
            feature13_v31_approved_mutation_dry_run.json
            feature13_v31_approved_mutation_dry_run.csv
