name: Feature 13 - Location Context Invalid Sync Only

on:
  workflow_dispatch:

jobs:
  sync-invalid-only:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Compile
        run: python -m py_compile patroli.py

      - name: Verify CLI
        run: |
          python patroli.py --help | grep -F -- "--sync-feature13-location-context-invalid-only"

      - name: Sync invalid-only (UPDATE only)
        run: python patroli.py --sync-feature13-location-context-invalid-only
