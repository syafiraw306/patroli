name: Feature 13 - LAPINSUS AI V1.1 Pilot #33979

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pilot:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      LAPINSUS_AI_MODEL: gpt-5.6-luna
      TAHUN_TARGET: "2026"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r feature13-lapinsus-ai-v1_1-requirements.txt
          pip install "python-dotenv>=1.0.1"

      - name: Compile V1.1
        run: |
          python -m py_compile \
            feature13_lapinsus_ai.py \
            feature13_lapinsus_engine.py \
            feature13_lapinsus_ai_pilot_33979.py

      - name: Generate pilot PDF (read-only)
        run: |
          python feature13_lapinsus_ai_pilot_33979.py

      - name: Verify generated files
        run: |
          echo "=== Current directory ==="
          pwd
          echo "=== Generated LAPINSUS files ==="
          ls -lah LAPINSUS_33979_AI_V1_PILOT.pdf LAPINSUS_33979_AI_V1_PILOT.json
          echo "=== File types ==="
          file LAPINSUS_33979_AI_V1_PILOT.pdf LAPINSUS_33979_AI_V1_PILOT.json
          echo "=== PDF size ==="
          stat -c '%n : %s bytes' LAPINSUS_33979_AI_V1_PILOT.pdf
          echo "=== JSON size ==="
          stat -c '%n : %s bytes' LAPINSUS_33979_AI_V1_PILOT.json
          test -s LAPINSUS_33979_AI_V1_PILOT.pdf
          test -s LAPINSUS_33979_AI_V1_PILOT.json

      - name: Upload pilot PDF and audit
        uses: actions/upload-artifact@v4
        with:
          name: LAPINSUS-33979-AI-V1-1-PILOT
          path: |
            ${{ github.workspace }}/LAPINSUS_33979_AI_V1_PILOT.pdf
            ${{ github.workspace }}/LAPINSUS_33979_AI_V1_PILOT.json
          if-no-files-found: error
          retention-days: 14

      - name: Safety summary
        run: |
          echo "=============================================="
          echo "FEATURE #13 LAPINSUS AI V1.1 PILOT #33979"
          echo "=============================================="
          echo "Mode                  : READ-ONLY PILOT"
          echo "Database mutation     : NONE"
          echo "Telegram notification : NONE"
          echo "Production articles   : NOT TOUCHED"
          echo "Article               : 33979"
          echo "AI model              : ${LAPINSUS_AI_MODEL}"
          echo "Artifact              : LAPINSUS-33979-AI-V1-1-PILOT"
          echo "=============================================="
