name: Feature 13 - Dashboard UAT V4

on:
  workflow_dispatch:

jobs:
  uat:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TAHUN_TARGET: '2026'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install beautifulsoup4 requests folium streamlit-folium reportlab

      - name: Install V4 files
        run: |
          cp feature13_v4_package/feature13_panel.py feature13_panel.py
          cp feature13_v4_package/feature13_lapinsus_engine.py feature13_lapinsus_engine.py
          cp feature13_v4_package/feature13_dashboard_uat_v4.py feature13_dashboard_uat_v4.py

      - name: Compile
        run: |
          python -m py_compile feature13_panel.py
          python -m py_compile feature13_lapinsus_engine.py
          python -m py_compile feature13_dashboard_uat_v4.py

      - name: V4 regression
        run: python feature13_v4_package/feature13_v4_regression.py

      - name: Real dashboard UAT
        run: python feature13_dashboard_uat_v4.py

      - name: Safety summary
        run: |
          echo "DATABASE MUTATION: NONE"
          echo "TELEGRAM: NOT SENT"
