name: Feature 13 - Post Delete Audit

on:
  workflow_dispatch:

jobs:
  post-delete-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Compile patroli.py
        run: python -m py_compile patroli.py

      - name: Feature 13 cleanup V2 regression test
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python patroli.py --test-feature13-cleanup-v2

      - name: Post-delete Feature 13 audit
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python patroli.py --audit-feature13-location

      - name: Post-delete Feature 13 cleanup classification
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python patroli.py --cleanup-feature13-location-dry-run-v2

      - name: Upload audit reports
        uses: actions/upload-artifact@v4
        with:
          name: feature13-post-delete-audit
          path: |
            feature13_location_audit.json
            feature13_location_cleanup_v2_dry_run.json
            feature13_location_cleanup_v2_dry_run.csv
          if-no-files-found: error
