name: Feature 13 - Location Safe Delete Execution

on:
  workflow_dispatch:

jobs:
  safe-delete-execution:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Compile patroli.py
        run: |
          python -m py_compile patroli.py

      - name: Run Cleanup V2 Regression Test
        run: |
          python patroli.py --test-feature13-cleanup-v2

      - name: Verify execution CLI
        run: |
          python patroli.py --help | grep -F -- "--safe-delete-feature13-execution"

      - name: Execute Feature 13 Approved Whitelist Delete
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python patroli.py --safe-delete-feature13-execution

      - name: Upload Delete Execution Report
        uses: actions/upload-artifact@v4
        with:
          name: feature13-location-delete-execution
          path: feature13_location_delete_execution.json
          if-no-files-found: error
