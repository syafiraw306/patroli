name: Dedupe Dry Run

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


  run: |
    echo "========================================"
    echo "VERIFY PATROLI.PY"
    echo "========================================"

    echo "SHA256:"
    sha256sum patroli.py

    echo "LINE COUNT:"
    wc -l patroli.py

    echo ""
    echo "CHECK resolve_article_url:"
    grep -n "def resolve_article_url" patroli.py

    echo ""
    echo "CHECK CORRECT ARGUMENT:"
    grep -n "rss_url=rss_link" patroli.py

    echo ""
    echo "CHECK WRONG ARGUMENT:"
    grep -n "rss_link=rss_link" patroli.py || true

    echo ""
    echo "CHECK SAVE BLOCK:"
    grep -n "Artikel valid setelah dedupe" patroli.py

    grep -n "\[SAVE\] NEW_ARTICLE" patroli.py

    grep -n "should_save_article(" patroli.py

    echo ""
    echo "========================================"
    echo "VERIFY DATABASE.PY"
    echo "========================================"

    sha256sum database.py
