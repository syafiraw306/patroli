name: Feature 13 - Dashboard UAT

on:
  workflow_dispatch:

jobs:
  dashboard-uat:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TAHUN_TARGET: '2026'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install reportlab folium streamlit streamlit-folium

      - name: Verify files
        run: |
          test -f app_feature13_integrated.py
          test -f feature13_panel.py
          test -f feature13_lapinsus_engine.py
          test -f feature13_dashboard_uat.py

      - name: Compile
        run: |
          python -m py_compile app_feature13_integrated.py
          python -m py_compile feature13_panel.py
          python -m py_compile feature13_lapinsus_engine.py
          python -m py_compile feature13_dashboard_uat.py

      - name: Run real Dashboard UAT (READ-ONLY)
        run: |
          python feature13_dashboard_uat.py

      - name: Safety summary
        if: success()
        run: |
          echo "DASHBOARD UAT: PASSED"
          echo "Database mutation: NONE"
          echo "Telegram: NOT SENT"
