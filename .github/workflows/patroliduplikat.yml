name: Patroli Siber

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Pilih mode patroli"
        required: true
        default: "once"
        type: choice
        options:
          - once
          - reclassify
          - dedupe-dry-run

jobs:
  patroli:
    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # 1. Ambil kode dari repository
      # ==========================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================================
      # 2. Install Python
      # ==========================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ==========================================================
      # 3. Install dependency
      # ==========================================================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ==========================================================
      # 4. Jalankan patroli sesuai pilihan
      # ==========================================================
      - name: Jalankan Patroli Siber
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          NAMA_SATKER: ${{ secrets.NAMA_SATKER }}
          TAHUN_TARGET: ${{ secrets.TAHUN_TARGET }}

        run: |

          echo "=========================================="
          echo "      PATROLI SIBER GITHUB ACTIONS"
          echo "=========================================="

          echo "Mode: ${{ inputs.mode }}"

          if [ "${{ inputs.mode }}" = "reclassify" ]; then

            echo "Menjalankan reklasifikasi..."
            python patroli.py --reclassify

          elif [ "${{ inputs.mode }}" = "dedupe-dry-run" ]; then

            echo "Menjalankan dedupe dry run..."
            python patroli.py --dedupe-dry-run

          else

            echo "Menjalankan patroli normal..."
            python patroli.py --once

          fi

          echo "=========================================="
          echo "         PATROLI SELESAI"
          echo "=========================================="
