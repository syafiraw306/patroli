name: Patroli Siber 

on:
  # ==========================================
  # PATROLI OTOMATIS
  # 08.00 WIB = 01.00 UTC
  # 15.00 WIB = 08.00 UTC
  # ==========================================
  schedule:
    - cron: "0 1 * * *"
    - cron: "0 8 * * *"

  # ==========================================
  # PATROLI MANUAL
  # ==========================================
  workflow_dispatch:
    inputs:
      mode:
        description: "Pilih mode patroli"
        required: true
        default: once
        type: choice
        options:
          - once
          - reclassify
          - dedupe-dry-run
          - dedupe
          - sanitize-database
          - audit-negative
          - audit-content-duplicates
          - audit-title-duplicates
          - audit-exact-duplicates
          - audit-event-duplicates
          - audit-event-quality
          - test-event-detection
          - test-event-detection-real
          - test-trend-escalation-real
          - test-real-new-article
          - test-real-new-article-e2e
          - test-new-article
          - test-telegram
          - database-audit
          - resolve-existing-urls-dry-run
          - resolve-existing-urls
          - intelligence-dashboard
          - test-intelligence-dashboard-real
          - early-warning
          - test-early-warning-real
          - intelligence-alerts
          - test-intelligence-alerts-real
          - intelligence-alerts-diagnostic-real
          - test-intelligence-alerts-controlled-fresh-real
          - incident-timeline
          - test-incident-timeline-real
          - incident-lifecycle
          - test-incident-lifecycle-real
          - incident-case-dossier
          - test-incident-case-dossier-real
          - cross-incident-relationships
          - issue-topic-detection
          - test-issue-topic-detection-real
          - cross-incident-candidate-audit-real
          - send-intelligence-alerts

jobs:
  patroli:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Jalankan Patroli Siber
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NAMA_SATKER: ${{ secrets.NAMA_SATKER }}
          TAHUN_TARGET: ${{ secrets.TAHUN_TARGET }}

        run: |
          echo "=========================================="
          echo "      PATROLI SIBER GITHUB ACTIONS"
          echo "=========================================="

          # ==========================================
          # JIKA DIJALANKAN OTOMATIS OLEH SCHEDULE
          # ==========================================
          if [ "${{ github.event_name }}" = "schedule" ]; then

            echo "Mode: SCHEDULE"
            echo "Menjalankan patroli normal (--once)..."

            python patroli.py --once

          # ==========================================
          # JIKA DIJALANKAN MANUAL
          # ==========================================
          else
          
            echo "Mode: ${{ inputs.mode }}"
          
            if [ "${{ inputs.mode }}" = "reclassify" ]; then
          
              echo "Menjalankan reklasifikasi..."
              python patroli.py --reclassify
          
            elif [ "${{ inputs.mode }}" = "dedupe-dry-run" ]; then
          
              echo "Menjalankan dedupe dry run..."
              python patroli.py --dedupe-dry-run
          
            elif [ "${{ inputs.mode }}" = "dedupe" ]; then
          
              echo "Menjalankan DEDUPE..."
              python patroli.py --dedupe
          
            elif [ "${{ inputs.mode }}" = "once" ]; then
          
              echo "Menjalankan patroli normal..."
              python patroli.py --once
          
            elif [ "${{ inputs.mode }}" = "sanitize-database" ]; then
          
              echo "Menjalankan sanitasi database..."
              python patroli.py --sanitize-database
            
            elif [ "${{ inputs.mode }}" = "audit-negative" ]; then
          
              echo "Menjalankan audit klasifikasi negatif..."
              python patroli.py --audit-negative-articles

            elif [ "${{ inputs.mode }}" = "audit-content-duplicates" ]; then

              echo "Menjalankan audit konten duplikat..."
              python patroli.py --audit-content-duplicates

            elif [ "${{ inputs.mode }}" = "audit-title-duplicates" ]; then
              echo "Menjalankan audit duplicate title..."
              python patroli.py --audit-title-duplicates

            elif [ "${{ inputs.mode }}" = "audit-exact-duplicates" ]; then
              echo "Menjalankan audit exact duplicate..."
              python patroli.py --audit-exact-duplicates

            elif [ "${{ inputs.mode }}" = "audit-event-duplicates" ]; then
              echo "Menjalankan audit event duplicate..."
              python patroli.py --audit-event-duplicates

            elif [ "${{ inputs.mode }}" = "audit-event-quality" ]; then
              echo "Menjalankan audit event quality..."
              python patroli.py --audit-event-quality

            elif [ "${{ inputs.mode }}" = "test-event-detection" ]; then
              echo "Menjalankan test Event/Incident Detection (READ-ONLY)..."
              python patroli.py --test-event-detection

            elif [ "${{ inputs.mode }}" = "test-event-detection-real" ]; then
              echo "Menjalankan test Event/Incident Detection REAL production (READ-ONLY)..."
              python patroli.py --test-event-detection-real

            elif [ "${{ inputs.mode }}" = "test-trend-escalation-real" ]; then
              echo "Menjalankan test Trend & Escalation Detection REAL production (READ-ONLY)..."
              python patroli.py --test-trend-escalation-real

            elif [ "${{ inputs.mode }}" = "intelligence-dashboard" ]; then
              echo "Generate Intelligence Dashboard REAL production (READ-ONLY)..."
              python patroli.py --intelligence-dashboard

            elif [ "${{ inputs.mode }}" = "test-intelligence-dashboard-real" ]; then
              echo "Menjalankan test Intelligence Dashboard REAL production (READ-ONLY)..."
              python patroli.py --test-intelligence-dashboard-real

            elif [ "${{ inputs.mode }}" = "early-warning" ]; then
              echo "Generate Cyber Intelligence / Early Warning REAL production (READ-ONLY)..."
              python patroli.py --early-warning

            elif [ "${{ inputs.mode }}" = "intelligence-alerts" ]; then
              echo "Generate Intelligence Alert & Prioritization REAL production (READ-ONLY)..."
              python patroli.py --intelligence-alerts

            elif [ "${{ inputs.mode }}" = "test-intelligence-alerts-real" ]; then
              echo "Menjalankan test Intelligence Alert & Prioritization REAL production (READ-ONLY)..."
              python patroli.py --test-intelligence-alerts-real

            elif [ "${{ inputs.mode }}" = "intelligence-alerts-diagnostic-real" ]; then
              echo "Menjalankan diagnostic Intelligence Alert REAL production (READ-ONLY)..."
              python patroli.py --intelligence-alerts-diagnostic-real

            elif [ "${{ inputs.mode }}" = "test-intelligence-alerts-controlled-fresh-real" ]; then
              echo "Menjalankan E2E Intelligence Alert dengan event production nyata, controlled fresh IN-MEMORY, Telegram MOCK..."
              python patroli.py --test-intelligence-alerts-controlled-fresh-real

            elif [ "${{ inputs.mode }}" = "incident-timeline" ]; then
              echo "Generate Incident Timeline & Cross-Media Correlation REAL production (READ-ONLY)..."
              python patroli.py --incident-timeline

            elif [ "${{ inputs.mode }}" = "test-incident-timeline-real" ]; then
              echo "Menjalankan test Incident Timeline & Cross-Media Correlation REAL production + Correlation Guard (READ-ONLY)..."
              python patroli.py --test-incident-timeline-real

            elif [ "${{ inputs.mode }}" = "incident-lifecycle" ]; then
              echo "Generate Incident Lifecycle & Follow-up Evidence REAL production (READ-ONLY)..."
              python patroli.py --incident-lifecycle

            elif [ "${{ inputs.mode }}" = "test-incident-lifecycle-real" ]; then
              echo "Menjalankan test Incident Lifecycle & Follow-up Evidence REAL production (READ-ONLY)..."
              python patroli.py --test-incident-lifecycle-real

            elif [ "${{ inputs.mode }}" = "incident-case-dossier" ]; then
              echo "Generate Incident Case Dossier & Analyst Action REAL production (READ-ONLY)..."
              python patroli.py --incident-case-dossier

            elif [ "${{ inputs.mode }}" = "test-incident-case-dossier-real" ]; then
              echo "Menjalankan test Incident Case Dossier & Analyst Action REAL production (READ-ONLY)..."
              python patroli.py --test-incident-case-dossier-real

            elif [ "${{ inputs.mode }}" = "cross-incident-relationships" ]; then
              echo "Generate Cross-Incident Relationship & Entity Link Analysis REAL production (READ-ONLY)..."
              python patroli.py --cross-incident-relationships

            elif [ "${{ inputs.mode }}" = "issue-topic-detection" ]; then
              echo "Generate Issue/Topic Detection REAL production (READ-ONLY)..."
              python patroli.py --issue-topic-detection

            elif [ "${{ inputs.mode }}" = "test-issue-topic-detection-real" ]; then
              echo "Menjalankan test Issue/Topic Detection REAL production (READ-ONLY)..."
              python patroli.py --test-issue-topic-detection-real

            elif [ "${{ inputs.mode }}" = "cross-incident-candidate-audit-real" ]; then
              echo "Menjalankan Candidate Audit + Precision Guard Cross-Incident REAL production (READ-ONLY)..."
              python patroli.py --cross-incident-candidate-audit-real

            elif [ "${{ inputs.mode }}" = "send-intelligence-alerts" ]; then
              echo "Mengirim Intelligence Alerts ke Telegram (EXPLICIT ACTION)..."
              python patroli.py --send-intelligence-alerts

            elif [ "${{ inputs.mode }}" = "test-early-warning-real" ]; then
              echo "Menjalankan test Cyber Intelligence / Early Warning REAL production (READ-ONLY)..."
              python patroli.py --test-early-warning-real

            elif [ "${{ inputs.mode }}" = "test-real-new-article-e2e" ]; then
              echo "Menjalankan test E2E REAL new article (WRITE -> READ-BACK -> TELEGRAM MOCK -> CLEANUP)..."
              python patroli.py --test-real-new-article-e2e

            elif [ "${{ inputs.mode }}" = "test-real-new-article" ]; then
              echo "Menjalankan test REAL new article (SAFE / READ-ONLY)..."
              python patroli.py --test-real-new-article

            elif [ "${{ inputs.mode }}" = "test-new-article" ]; then
              echo "Menjalankan test synthetic new article..."
              python patroli.py --test-new-article

            elif [ "${{ inputs.mode }}" = "test-telegram" ]; then
              echo "Menjalankan test alert telegram..."
              python patroli.py --test-telegram

            elif [ "${{ inputs.mode }}" = "database-audit" ]; then
              echo "Menjalankan audit database..."
              python patroli.py --database-audit
            
            elif [ "${{ inputs.mode }}" = "resolve-existing-urls-dry-run" ]; then
              echo "Menjalankan resolve-existing-urls-dry-run..."
              python patroli.py --resolve-existing-urls-dry-run

            elif [ "${{ inputs.mode }}" = "resolve-existing-urls" ]; then
              echo "Menjalankan resolve-existing-urls..."
              python patroli.py --resolve-existing-urls
              
            else
          
              echo "Mode tidak dikenal: ${{ inputs.mode }}"
              exit 1
          
            fi
          
          fi
          
          echo "=========================================="
          echo "         PATROLI SELESAI"
          echo "=========================================="

      # ==========================================
      # UPLOAD LAPORAN DEDUPE
      # ==========================================
      - name: Upload Dedupe Report
        if: ${{ inputs.mode == 'dedupe-dry-run' || inputs.mode == 'dedupe' }}
        uses: actions/upload-artifact@v4
        with:
          name: dedupe-report
          path: |
            dedupe_report.csv
            dedupe_report.json
            dedupe_delete_report.csv
            dedupe_delete_report.json
            dedupe_diagnostic_report.csv
            dedupe_diagnostic_report.json
          if-no-files-found: warn
          retention-days: 30

      # ==========================================
      # UPLOAD LAPORAN EXISTING URL REPAIR
      # ==========================================
      - name: Upload Existing URL Repair Report
        if: ${{ inputs.mode == 'resolve-existing-urls-dry-run' || inputs.mode == 'resolve-existing-urls' }}
        uses: actions/upload-artifact@v4
        with:
          name: existing-url-repair-report
          path: |
            existing_url_repair.csv
            existing_url_repair.json
          if-no-files-found: warn
          retention-days: 30


      # ==========================================
      # UPLOAD INTELLIGENCE DASHBOARD
      # ==========================================
      - name: Upload Intelligence Dashboard
        if: ${{ inputs.mode == 'intelligence-dashboard' || inputs.mode == 'test-intelligence-dashboard-real' }}
        uses: actions/upload-artifact@v4
        with:
          name: intelligence-dashboard
          path: |
            intelligence_dashboard.json
            intelligence_dashboard.html
            intelligence_dashboard_events.csv
          if-no-files-found: warn
          retention-days: 30

      # ==========================================
      # UPLOAD FEATURE #6 — INTELLIGENCE ALERTS
      # ==========================================
      - name: Upload Intelligence Alerts
        if: ${{ inputs.mode == 'intelligence-alerts' || inputs.mode == 'test-intelligence-alerts-real' || inputs.mode == 'intelligence-alerts-diagnostic-real' || inputs.mode == 'test-intelligence-alerts-controlled-fresh-real' }}
        uses: actions/upload-artifact@v4
        with:
          name: intelligence-alerts
          path: |
            intelligence_alerts.json
            intelligence_alerts.html
            intelligence_alerts.csv
            intelligence_alerts_diagnostic.json
            intelligence_alerts_diagnostic.html
            intelligence_alerts_diagnostic.csv
          if-no-files-found: warn
          retention-days: 30

      # ==========================================
      # UPLOAD FEATURE #7 — INCIDENT TIMELINE
      # ==========================================
      - name: Upload Incident Timeline
        if: ${{ inputs.mode == 'incident-timeline' || inputs.mode == 'test-incident-timeline-real' }}
        uses: actions/upload-artifact@v4
        with:
          name: incident-timeline
          path: |
            incident_timeline.json
            incident_timeline.html
            incident_timeline.csv
          if-no-files-found: warn
          retention-days: 30
      # ==========================================
      # UPLOAD FEATURE #8 — INCIDENT LIFECYCLE
      # ==========================================
      - name: Upload Incident Lifecycle
        if: ${{ inputs.mode == 'incident-lifecycle' || inputs.mode == 'test-incident-lifecycle-real' }}
        uses: actions/upload-artifact@v4
        with:
          name: incident-lifecycle
          path: |
            incident_lifecycle.json
            incident_lifecycle.html
            incident_lifecycle.csv
          if-no-files-found: warn
          retention-days: 30

      # ==========================================
      # UPLOAD FEATURE #9 — INCIDENT CASE DOSSIER
      # ==========================================
      - name: Upload Incident Case Dossier
        if: ${{ inputs.mode == 'incident-case-dossier' || inputs.mode == 'test-incident-case-dossier-real' }}
        uses: actions/upload-artifact@v4
        with:
          name: incident-case-dossier
          path: |
            incident_case_dossier.json
            incident_case_dossier.html
            incident_case_dossier.csv
          if-no-files-found: warn
          retention-days: 30


      # ==========================================
      # UPLOAD FEATURE #10 — CROSS-INCIDENT RELATIONSHIP
      # ==========================================
      - name: Upload Cross-Incident Relationships
        if: ${{ inputs.mode == 'cross-incident-relationships' }}
        uses: actions/upload-artifact@v4
        with:
          name: cross-incident-relationships
          path: |
            cross_incident_relationships.json
            cross_incident_relationships.html
            cross_incident_relationships.csv
          if-no-files-found: warn
          retention-days: 30
      
      # ==========================================
      # FEATURE #11 V2 — SEMANTIC ISSUE / TOPIC DETECTION
      # ==========================================
      - name: Upload Issue Topic Detection
        if: ${{ inputs.mode == 'issue-topic-detection' || inputs.mode == 'test-issue-topic-detection-real' }}
        uses: actions/upload-artifact@v4
        with:
          name: issue-topic-detection
          path: |
            issue_topic_detection.json
            issue_topic_detection.html
            issue_topic_detection.csv
          if-no-files-found: warn
          retention-days: 30

      # ==========================================
      # FEATURE #10 — PERSON CONTEXT GUARD V26
      # ==========================================
      - name: Upload Cross-Incident Candidate Audit
        if: ${{ inputs.mode == 'cross-incident-candidate-audit-real' }}
        uses: actions/upload-artifact@v4
        with:
          name: cross-incident-candidate-audit
          path: |
            cross_incident_relationship_audit.json
            cross_incident_relationship_audit.html
            cross_incident_relationship_audit.csv
          if-no-files-found: warn
          retention-days: 30
