name: Patroli Siber

on:
  # ==========================================
  # PATROLI OTOMATIS
  # 08.00 WIB = 01.00 UTC
  # 15.00 WIB = 08.00 UTC
  # ==========================================
  schedule:
    - cron: "0 1 * * *"
    - cron: "0 8 * * *"

  # ==========================================
  # PATROLI MANUAL
  # ==========================================
  workflow_dispatch:
    inputs:
      mode:
        description: "Pilih mode patroli"
        required: true
        default: once
        type: choice
        options:
          - once
          - reclassify
          - dedupe-dry-run
          - dedupe

jobs:
  patroli:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Jalankan Patroli Siber
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NAMA_SATKER: ${{ secrets.NAMA_SATKER }}
          TAHUN_TARGET: ${{ secrets.TAHUN_TARGET }}

        run: |
          echo "=========================================="
          echo "      PATROLI SIBER GITHUB ACTIONS"
          echo "=========================================="

          # ==========================================
          # JIKA DIJALANKAN OTOMATIS OLEH SCHEDULE
          # ==========================================
          if [ "${{ github.event_name }}" = "schedule" ]; then

            echo "Mode: SCHEDULE"
            echo "Menjalankan patroli normal (--once)..."

            python patroli.py --once

          # ==========================================
          # JIKA DIJALANKAN MANUAL
          # ==========================================
          else

            echo "Mode: ${{ inputs.mode }}"

            if [ "${{ inputs.mode }}" = "reclassify" ]; then

              echo "Menjalankan reklasifikasi..."
              python patroli.py --reclassify

            elif [ "${{ inputs.mode }}" = "dedupe-dry-run" ]; then

              echo "Menjalankan dedupe dry run..."
              python patroli.py --dedupe-dry-run

            elif [ "${{ inputs.mode }}" = "dedupe" ]; then

              echo "Menjalankan DEDUPE..."
              python patroli.py --dedupe

            else

              echo "Menjalankan patroli normal..."
              python patroli.py --once

            fi

          fi

          echo "=========================================="
          echo "         PATROLI SELESAI"
          echo "=========================================="

      # ==========================================
      # UPLOAD LAPORAN DEDUPE
      # ==========================================
      - name: Upload Dedupe Report
        if: ${{ inputs.mode == 'dedupe-dry-run' || inputs.mode == 'dedupe' }}
        uses: actions/upload-artifact@v4
        with:
          name: dedupe-report
          path: |
            dedupe_report.csv
            dedupe_report.json
            dedupe_delete_report.csv
            dedupe_delete_report.json
            dedupe_diagnostic_report.csv
            dedupe_diagnostic_report.json
          if-no-files-found: warn
          retention-days: 30
