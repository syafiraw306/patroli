name: Patroli Siber Kejari Deli Serdang

on:
  schedule:
    # 08:00 WIB = 01:00 UTC
    - cron: "0 1 * * *"

    # 15:00 WIB = 08:00 UTC
    - cron: "0 8 * * *"

  # Menjalankan workflow secara manual
  workflow_dispatch:

jobs:
  patroli:
    runs-on: ubuntu-latest

    steps:
      # ==========================================
      # 1. Checkout repository
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v5

      # ==========================================
      # 2. Setup Python
      # ==========================================
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      # ==========================================
      # 3. Install dependencies
      # ==========================================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install \
              requests \
              feedparser \
              beautifulsoup4 \
              python-dateutil \
              supabase \
              streamlit
          fi

      # ==========================================
      # 4. Jalankan patroli.py
      # ==========================================
      - name: VERIFY SOURCE
        run: |
          echo "=== COMMIT ==="
          git rev-parse HEAD

          echo "=== CURRENT DIRECTORY ==="
          pwd

          echo "=== FILES ==="
          ls -la
      
          echo "=== PATROLI FILE ==="
          grep -n "PATROLI VERSION" patroli.py || true
      
          echo "=== DATABASE FILE ==="
          grep -n "DATABASE VERSION" database.py || true
      
          echo "=== SUMMARY ==="
          grep -n "summary" patroli.py database.py || true
      
          echo "=== FAILED COUNT ==="
          grep -n "failed_count" patroli.py database.py || true
      
          echo "=== LUBUK PAKAM ==="
          grep -n "Lubuk Pakam" patroli.py database.py || true
      
          echo "=== COMPILE ==="
          python -m py_compile patroli.py database.py
      
      - name: Jalankan Patroli Siber
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          NAMA_SATKER: "Kejaksaan Negeri Deli Serdang"
          TAHUN_TARGET: ${{ secrets.TAHUN_TARGET }}

        run: |
          python patroli.py

      # ==========================================
      # 5. Status berhasil
      # ==========================================
      - name: Patroli berhasil
        if: success()
        run: |
          echo "=========================================="
          echo "PATROLI SIBER BERHASIL"
          echo "=========================================="
          echo "08:00 WIB dan 15:00 WIB"
          echo "=========================================="

      # ==========================================
      # 6. Status gagal
      # ==========================================
      - name: Patroli gagal
        if: failure()
        run: |
          echo "=========================================="
          echo "PATROLI SIBER GAGAL"
          echo "=========================================="
          echo "Silakan periksa log GitHub Actions."
          echo "=========================================="

