name: Patroli Siber

on:
  workflow_dispatch:

  schedule:
    # 08:00 WIB = 01:00 UTC
    - cron: "0 1 * * *"

    # 15:00 WIB = 08:00 UTC
    - cron: "0 8 * * *"

jobs:
  patroli:
    name: Jalankan Patroli Siber
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v5

      # ======================================================
      # PYTHON
      # ======================================================

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      # ======================================================
      # INSTALL DEPENDENCIES
      # ======================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ======================================================
      # ENVIRONMENT
      # ======================================================

      - name: Check required files
        run: |
          echo "=== FILE CHECK ==="
          pwd
          ls -la
          echo
          echo "=== WORKFLOW ==="
          ls -la .github/workflows
          echo
          echo "=== PYTHON FILES ==="
          ls -la *.py

      # ======================================================
      # PATROLI
      # ======================================================

      - name: Jalankan Patroli
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}

          NAMA_SATKER: ${{ secrets.NAMA_SATKER }}

        run: |
          python patroli.py

      # ======================================================
      # SELESAI
      # ======================================================

      - name: Status selesai
        if: success()
        run: |
          echo "======================================"
          echo "PATROLI BERHASIL"
          echo "======================================"
          echo "Workflow selesai."
          echo "Database telah diproses."
          echo "Reklasifikasi seluruh database telah dijalankan."
