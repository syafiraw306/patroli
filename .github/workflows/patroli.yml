name: Patroli Siber Kejari Deli Serdang

on:
  schedule:
    # 08:00 WIB = 01:00 UTC
    - cron: "0 1 * * *"

    # 15:00 WIB = 08:00 UTC
    - cron: "0 8 * * *"

  # Bisa dijalankan manual dari GitHub Actions
  workflow_dispatch:

jobs:
  patroli:
    runs-on: ubuntu-latest

    steps:
      # ==========================================
      # 1. Checkout repository
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # 2. Setup Python
      # ==========================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # ==========================================
      # 3. Install dependencies
      # ==========================================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install \
              requests \
              feedparser \
              beautifulsoup4 \
              python-dateutil
          fi

      # ==========================================
      # 4. Jalankan Patroli Siber
      # ==========================================
      - name: Jalankan patroli.py
        env:
          # ------------------------------
          # Supabase
          # ------------------------------
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

          # ------------------------------
          # Telegram
          # ------------------------------
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}

          # ------------------------------
          # Nama Satker
          # ------------------------------
          NAMA_SATKER: "Kejaksaan Negeri Deli Serdang"

          # ------------------------------
          # Tahun target
          # ------------------------------
          TAHUN_TARGET: "2026"

        run: |
          python patroli.py

      # ==========================================
      # 5. Informasi selesai
      # ==========================================
      - name: Patroli selesai
        if: success()
        run: |
          echo "=========================================="
          echo "PATROLI SIBER BERHASIL"
          echo "=========================================="
          echo "Jadwal: 08:00 WIB dan 15:00 WIB"
          echo "=========================================="

      # ==========================================
      # 6. Informasi jika gagal
      # ==========================================
      - name: Patroli gagal
        if: failure()
        run: |
          echo "=========================================="
          echo "PATROLI SIBER GAGAL"
          echo "=========================================="
          echo "Periksa log GitHub Actions."
          echo "=========================================="
