name: Feature 13 - Deli Serdang Location Cleanup V2 Dry Run

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  feature13-cleanup-v2:
    name: Feature #13 Cleanup V2 Regression + Dry Run
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Verify Feature #13 Cleanup V2 command
        run: |
          python -m py_compile patroli.py
          python patroli.py --help | grep -F -- "--test-feature13-cleanup-v2"
          python patroli.py --help | grep -F -- "--cleanup-feature13-location-dry-run-v2"

      - name: Run Cleanup V2 regression tests
        run: |
          python patroli.py --test-feature13-cleanup-v2

      - name: Run Cleanup V2 read-only dry run
        run: |
          python patroli.py --cleanup-feature13-location-dry-run-v2

      - name: Upload Cleanup V2 reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feature13-location-cleanup-v2-dry-run
          if-no-files-found: ignore
          path: |
            feature13_location_cleanup_v2_dry_run.json
            feature13_location_cleanup_v2_dry_run.csv
