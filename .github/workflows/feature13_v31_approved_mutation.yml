name: Feature 13 - V3.1 Approved Mutation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutate-feature13-location:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify mutation artifacts
        env:
          WHITELIST_FILE: feature13_v31_final_approval_whitelist_CORRECTED.json
          MUTATION_SCRIPT: feature13_v31_approved_mutation.py
        run: |
          test -f "$WHITELIST_FILE"
          test -f "$MUTATION_SCRIPT"
          python -m py_compile "$MUTATION_SCRIPT"
          echo "Artifacts OK"

      - name: Run final regression test
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python patroli.py --test-feature13-cleanup-v2

      - name: Re-run final safety audit immediately before mutation
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python feature13_v31_final_mutation_safety_audit_CORRECTED.py

      - name: Execute approved mutation
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python feature13_v31_approved_mutation.py

      - name: Upload mutation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feature13-v31-approved-mutation-reports
          path: |
            feature13_v31_approved_mutation_report.json
            feature13_v31_approved_mutation_report.csv
            feature13_v31_final_mutation_safety_audit.json
            feature13_v31_final_mutation_safety_audit.csv
          if-no-files-found: warn
